                        if (this.game.turn !== color) return;

                        const rootMoves = this.game.getLegalMoves(color);
                        if (rootMoves.length === 0) {
                            callback(null);
                            return;
                        }

                        // maxDepth = how deep to search; timeMs = hard budget. Iterative deepening keeps the
                        // deepest result found in time, so slow devices (e.g. Kindle) just search shallower.
                        const configs = {
                            1: { maxDepth: 1, useQuiescence: false, jitter: 50, timeMs: 1000 },
                            2: { maxDepth: 2, useQuiescence: false, jitter: 15, timeMs: 2000 },
                            3: { maxDepth: 3, useQuiescence: true, jitter: 0, timeMs: 3000 },
                            4: { maxDepth: 5, useQuiescence: true, jitter: 0, timeMs: 5000 }
                        };
                        const cfg = configs[level] || configs[2];

                        const isMaximizing = (color === 'w');
                        this.deadline = Date.now() + cfg.timeMs;
                        this.aborted = false;
                        this.nodes = 0;

                        this.orderMoves(rootMoves);
                        let bestMove = rootMoves[0];

                        for (let depth = 1; depth <= cfg.maxDepth; depth++) {
                            let iterBest = null;
                            let iterValue = isMaximizing ? -Infinity : Infinity;
                            let alpha = -Infinity;
                            let beta = Infinity;

                            for (let move of rootMoves) {
                                const undo = this.game.makeMove(move, false);
                                let val = this.minimax(depth - 1, alpha, beta, !isMaximizing, cfg.useQuiescence, 1);
                                this.game.undoMove(undo);
                                if (this.aborted) break;

                                if (cfg.jitter > 0) {
                                    val += (Math.random() * cfg.jitter * 2 - cfg.jitter);
                                }

                                if (isMaximizing ? val > iterValue : val < iterValue) {
                                    iterValue = val;
                                    iterBest = move;
                                    if (isMaximizing) alpha = Math.max(alpha, val);
                                    else beta = Math.min(beta, val);
                                }
                            }

                            // The previous best is searched first, so a partial iteration's best is still trustworthy
                            if (iterBest) bestMove = iterBest;
                            if (this.aborted) break;

                            // Search the best move first next iteration (better pruning)
                            rootMoves.splice(rootMoves.indexOf(bestMove), 1);
                            rootMoves.unshift(bestMove);

                            if (Math.abs(iterValue) > 90000) break; // forced mate found
                        }

                        callback(bestMove);
                    }, 30);
                }
            }

            /* ==========================================================================
               UI CONTROLLER & INTERACTION
               ========================================================================== */
            class EinkChessUI {
                constructor() {
                    this.game = new ChessGame();
                    this.ai = new ChessAI(this.game);
                    this.sound = new EinkSoundEngine();

                    this.boardFlipped = false;
                    this.gameMode = 'human-ai-white';
                    this.aiLevel = 2;
                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.lastMove = null;
                    this.pendingPromotionMove = null;
                    this.isThinking = false;
                    this.autoFlashInterval = 5;
                    this.threatSquares = [];
                    this.hintText = null;

                    this.initDOM();
                    this.bindEvents();
                    this.loadPreferences();
                    this.updatePlayerCards();
                    this.render();
                }

                initDOM() {
                    this.boardEl = document.getElementById('board');
                    this.ranksBar = document.getElementById('ranks-bar');
                    this.filesBar = document.getElementById('files-bar');
                    this.topPlayerCard = document.getElementById('top-player-card');
                    this.bottomPlayerCard = document.getElementById('bottom-player-card');
                    this.topStatusBadge = document.getElementById('top-status-badge');
                    this.bottomStatusBadge = document.getElementById('bottom-status-badge');
                    this.topCaptured = document.getElementById('top-captured');
                    this.bottomCaptured = document.getElementById('bottom-captured');
                    this.topName = document.getElementById('top-name');
                    this.topMeta = document.getElementById('top-meta');
                    this.bottomName = document.getElementById('bottom-name');
                    this.bottomMeta = document.getElementById('bottom-meta');
                    this.topBadge = document.getElementById('top-badge');
                    this.bottomBadge = document.getElementById('bottom-badge');
                    this.flashOverlay = document.getElementById('eink-flash-overlay');

                    this.boardEl.innerHTML = '';
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const sq = document.createElement('div');
                            sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                            sq.dataset.row = r;
                            sq.dataset.col = c;
                            this.boardEl.appendChild(sq);
                        }
                    }
                }

                bindEvents() {
                    this.boardEl.addEventListener('click', (e) => {
                        const sq = e.target.closest('.square');
                        if (!sq) return;
                        const r = parseInt(sq.dataset.row, 10);
                        const c = parseInt(sq.dataset.col, 10);
                        this.handleSquareClick(r, c);
                    });

                    document.getElementById('btn-new-game').addEventListener('click', () => {
                        this.startNewGame();
                    });

                    document.getElementById('btn-undo').addEventListener('click', () => this.handleUndo());
                    document.getElementById('btn-flip-board').addEventListener('click', () => this.toggleBoardFlip());
                    document.getElementById('btn-hint').addEventListener('click', () => this.handleHint());
                    document.getElementById('btn-flash-refresh').addEventListener('click', () => this.triggerFlash());

                    document.getElementById('select-mode').addEventListener('change', (e) => {
                        this.gameMode = e.target.value;
                        this.updatePlayerCards();
                        this.startNewGame();
                    });

                    document.getElementById('select-ai-level').addEventListener('change', (e) => {
                        this.aiLevel = parseInt(e.target.value, 10);
                        this.updatePlayerCards();
                    });
                }

                loadPreferences() {
                    this.setTheme('theme-carta');
                    this.autoFlashInterval = 5;
                    this.sound.enabled = false;
                }

                setTheme(themeName) {
                    document.body.className = '';
                    if (themeName && themeName !== 'theme-carta') {
                        document.body.classList.add(themeName);
                    }
                }

                toggleSound() {
                    this.sound.enabled = !this.sound.enabled;
                    if (this.sound.enabled) this.sound.playMove();
                }

                updateSoundButtonUI() { }

                triggerFlash(callback) {
                    this.flashOverlay.className = 'flash-black';
                    setTimeout(() => {
                        this.flashOverlay.className = 'flash-white';
                        setTimeout(() => {
                            this.flashOverlay.className = '';
                            if (callback) callback();
                        }, 110);
                    }, 110);
                }

                openModal(id) {
                    document.getElementById(id).classList.add('open');
                }

                closeModal(id) {
                    document.getElementById(id).classList.remove('open');
                }

                toggleBoardFlip() {
                    this.boardFlipped = !this.boardFlipped;
                    this.updatePlayerCards();
                    this.render();
                }

                startNewGame() {
                    this.gameSessionId = (this.gameSessionId || 0) + 1;
                    this.isThinking = false;
                    this.pendingPromotionMove = null;
                    this.threatSquares = [];
                    this.hintText = null;
                    this.closeModal('promotion-modal');

                    this.game.reset();
                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.lastMove = null;

                    if (this.gameMode === 'human-ai-black') {
                        this.boardFlipped = true;
                    } else {
                        this.boardFlipped = false;
                    }

                    this.updatePlayerCards();
                    this.render();

                    if (this.gameMode === 'human-ai-black' && this.game.turn === 'w') {
                        this.triggerAIMove();
                    }
                }

                updatePlayerCards() {
                    const aiLabels = {
                        1: 'Level 1 (Novice)',
                        2: 'Level 2 (Club)',
                        3: 'Level 3 (Expert)',
                        4: 'Level 4 (Master)'
                    };

                    const aiSelect = document.getElementById('select-ai-level');
                    if (aiSelect) {
                        aiSelect.style.display = (this.gameMode === 'human-human') ? 'none' : 'block';
                    }

                    // Describe each color's player, then place them by board orientation
                    const ai = { name: 'AI', meta: aiLabels[this.aiLevel] };
                    let white, black;
                    if (this.gameMode === 'human-ai-white') {
                        white = { name: 'Human', meta: ' (White)' };
                        black = ai;
                    } else if (this.gameMode === 'human-ai-black') {
                        white = ai;
                        black = { name: 'Human', meta: ' (Black)' };
                    } else {
                        white = { name: 'Player 1', meta: 'White' };
                        black = { name: 'Player 2', meta: 'Black' };
                    }

                    const whiteIsBottom = !this.boardFlipped;
                    const bottom = whiteIsBottom ? white : black;
                    const top = whiteIsBottom ? black : white;
                    this.bottomName.textContent = bottom.name;
                    this.bottomMeta.textContent = bottom.meta;
                    this.bottomBadge.className = `player-badge ${whiteIsBottom ? 'white' : 'black'}`;
                    this.topName.textContent = top.name;
                    this.topMeta.textContent = top.meta;
                    this.topBadge.className = `player-badge ${whiteIsBottom ? 'black' : 'white'}`;
                }

                isHumanTurn() {
                    if (this.gameMode === 'human-human') return true;
                    if (this.gameMode === 'human-ai-white') return this.game.turn === 'w';
                    if (this.gameMode === 'human-ai-black') return this.game.turn === 'b';
                    return false;
                }

                handleSquareClick(r, c) {
                    if (this.isThinking) return;
                    if (!this.isHumanTurn()) return;

                    const piece = this.game.board[r][c];

                    if (this.selectedSquare) {
                        const chosenMove = this.legalMovesFromSelected.find(m => m.to.r === r && m.to.c === c);

                        if (chosenMove) {
                            if (chosenMove.promotion) {
                                this.promptPromotion(chosenMove);
                                return;
                            }

                            this.applyMove(chosenMove);
                            this.selectedSquare = null;
                            this.legalMovesFromSelected = [];
                            return;
                        }

                        if (this.selectedSquare.r === r && this.selectedSquare.c === c) {
                            this.selectedSquare = null;
                            this.legalMovesFromSelected = [];
                            this.render();
                            return;
                        }
                    }

                    if (piece && piece.color === this.game.turn) {
                        this.selectedSquare = { r, c };
                        const allLegal = this.game.getLegalMoves(this.game.turn);
                        this.legalMovesFromSelected = allLegal.filter(m => m.from.r === r && m.from.c === c);
                        this.render();
                    } else {
                        this.selectedSquare = null;
                        this.legalMovesFromSelected = [];
                        this.render();
                    }
                }

                promptPromotion(baseMove) {
                    this.pendingPromotionMove = baseMove;
                    const container = document.getElementById('promotion-choices');
                    container.innerHTML = '';
                    const color = this.game.turn;

                    const pieces = [
                        { type: 'q', label: 'Queen' },
                        { type: 'r', label: 'Rook' },
                        { type: 'b', label: 'Bishop' },
                        { type: 'n', label: 'Knight' }
                    ];

                    pieces.forEach(p => {
                        const btn = document.createElement('div');
                        btn.className = 'promotion-option';
                        const symbolId = color === 'w' ? p.type.toUpperCase() : p.type;
                        btn.innerHTML = `
              <svg class="promotion-piece-icon" viewBox="0 0 45 45">
                <use href="#piece-${symbolId}"></use>
              </svg>
              <span class="promotion-label">${p.label}</span>
            `;
                        btn.addEventListener('click', () => {
                            this.closeModal('promotion-modal');
                            const finalMove = { ...this.pendingPromotionMove, promotion: p.type };
                            this.applyMove(finalMove);
                            this.selectedSquare = null;
                            this.legalMovesFromSelected = [];
                        });
                        container.appendChild(btn);
                    });

                    this.openModal('promotion-modal');
                }

                applyMove(move) {
                    const entry = this.game.executeMove(move);
                    this.lastMove = move;
                    this.threatSquares = [];
                    this.hintText = null;

                    if (move.capture) {
                        this.sound.playCapture();
                    } else {
                        this.sound.playMove();
                    }

                    const status = this.game.getGameStatus();
                    if (status.inCheck) {
                        this.sound.playCheck();
                    }
                    if (status.isOver) {
                        this.sound.playEnd();
                    }

                    if (this.autoFlashInterval > 0 && (this.game.history.length % (this.autoFlashInterval * 2) === 0)) {
                        this.triggerFlash();
                    }

                    this.render();

                    if (!status.isOver && !this.isHumanTurn()) {
                        this.triggerAIMove();
                    }
                }

                getActiveStatusBadge() {
                    const whiteIsBottom = !this.boardFlipped;
                    const currentTurnIsWhite = this.game.turn === 'w';
                    const isBottomTurn = (currentTurnIsWhite && whiteIsBottom) || (!currentTurnIsWhite && !whiteIsBottom);
                    return isBottomTurn ? this.bottomStatusBadge : this.topStatusBadge;
                }

                triggerAIMove() {
                    this.isThinking = true;
                    const currentSession = this.gameSessionId;
                    const activeBadge = this.getActiveStatusBadge();
                    if (activeBadge) {
                        activeBadge.textContent = 'Thinking...';
                        activeBadge.className = 'player-status-badge thinking';
                        activeBadge.style.display = 'inline-block';
                    }

                    this.ai.findBestMove(this.aiLevel, this.game.turn, (bestMove) => {
                        if (this.gameSessionId !== currentSession) return;
                        this.isThinking = false;
                        if (bestMove) {
                            this.applyMove(bestMove);
                        }
                    }, () => this.gameSessionId !== currentSession);
                }

                handleUndo() {
                    if (this.isThinking) return;

                    if (this.gameMode === 'human-human') {
                        this.game.undoLastMove();
                    } else {
                        this.game.undoLastMove();
                        if (!this.isHumanTurn()) {
                            this.game.undoLastMove();
                        }
                    }

                    this.selectedSquare = null;
                    this.legalMovesFromSelected = [];
                    this.threatSquares = [];
                    this.hintText = null;
                    this.lastMove = this.game.history.length > 0 ? this.game.history[this.game.history.length - 1].move : null;
                    this.render();

                    // Nothing left to undo but it's the AI's turn (e.g. human plays Black): let the AI move again
                    if (!this.isHumanTurn() && !this.game.getGameStatus().isOver) {
                        this.triggerAIMove();
                    }
                }

                handleHint() {
                    if (this.isThinking) return;
                    if (!this.isHumanTurn()) return;

                    // Toggle off if already active
                    if (this.threatSquares && this.threatSquares.length > 0) {
                        this.threatSquares = [];
                        this.selectedSquare = null;
                        this.legalMovesFromSelected = [];
                        this.hintText = null;
                        this.render();
                        return;
                    }

                    const opponent = this.game.turn === 'w' ? 'b' : 'w';
                    this.threatSquares = this.game.getOpponentThreatSquares(opponent);

                    this.isThinking = true;
                    const currentSession = this.gameSessionId;
                    this.hintText = 'Analyzing...';

                    // Render black threat circles immediately for zero latency on E-Ink
                    this.render();

                    this.ai.findBestMove(3, this.game.turn, (hintMove) => {
                        if (this.gameSessionId !== currentSession) return;
                        this.isThinking = false;
                        if (hintMove) {
                            this.selectedSquare = { r: hintMove.from.r, c: hintMove.from.c };
                            this.legalMovesFromSelected = [hintMove];
                            this.hintText = `Hint: ${String.fromCharCode(97 + hintMove.from.c)}${8 - hintMove.from.r}→${String.fromCharCode(97 + hintMove.to.c)}${8 - hintMove.to.r} (● Danger)`;
                        } else {
                            this.hintText = null;
                        }
                        this.render();
                    }, () => this.gameSessionId !== currentSession);
                }

                render() {
                    this.ranksBar.innerHTML = '';
                    this.filesBar.innerHTML = '';
                    for (let i = 0; i < 8; i++) {
                        const rankSpan = document.createElement('span');
                        rankSpan.textContent = this.boardFlipped ? (i + 1) : (8 - i);
                        this.ranksBar.appendChild(rankSpan);

                        const fileSpan = document.createElement('span');
                        fileSpan.textContent = String.fromCharCode(97 + (this.boardFlipped ? (7 - i) : i));
                        this.filesBar.appendChild(fileSpan);
                    }

                    const inCheckKing = this.game.isInCheck(this.game.turn) ? this.game.getKingPosition(this.game.turn) : null;

                    for (let displayR = 0; displayR < 8; displayR++) {
                        for (let displayC = 0; displayC < 8; displayC++) {
                            const r = this.boardFlipped ? (7 - displayR) : displayR;
                            const c = this.boardFlipped ? (7 - displayC) : displayC;

                            const sqIndex = displayR * 8 + displayC;
                            const sq = this.boardEl.children[sqIndex];
                            sq.dataset.row = r;
                            sq.dataset.col = c;
                            sq.innerHTML = '';

                            sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

                            if (this.selectedSquare && this.selectedSquare.r === r && this.selectedSquare.c === c) {
                                sq.classList.add('selected');
                            }

                            if (this.lastMove && ((this.lastMove.from.r === r && this.lastMove.from.c === c) || (this.lastMove.to.r === r && this.lastMove.to.c === c))) {
                                sq.classList.add('last-move');
                            }

                            if (inCheckKing && inCheckKing.r === r && inCheckKing.c === c) {
                                sq.classList.add('in-check');
                            }

                            const piece = this.game.board[r][c];
                            if (piece) {
                                const symbolId = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                                svg.setAttribute('class', 'piece-svg');
                                svg.setAttribute('viewBox', '0 0 45 45');
                                const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                                use.setAttribute('href', `#piece-${symbolId}`);
                                svg.appendChild(use);
                                sq.appendChild(svg);
                            }

                            // Opponent Threat Indicator (Black Circle - "where not to move to")
                            if (this.threatSquares && this.threatSquares.some(t => t.r === r && t.c === c)) {
                                const threatEl = document.createElement('div');
                                threatEl.className = 'threat-circle';
                                threatEl.title = 'Other player can move or attack here';
                                sq.appendChild(threatEl);
                            }

                            const isTargetMove = this.legalMovesFromSelected.find(m => m.to.r === r && m.to.c === c);
                            if (isTargetMove) {
                                if (piece || isTargetMove.isEnPassant) {
                                    const captureEl = document.createElement('div');
                                    captureEl.className = 'capture-hint';
                                    sq.appendChild(captureEl);
                                } else {
                                    const dotEl = document.createElement('div');
                                    dotEl.className = 'move-hint';
                                    sq.appendChild(dotEl);
                                }
                            }
                        }
                    }

                    // Active player card highlight & status badges
                    const whiteIsBottom = !this.boardFlipped;
                    const currentTurnIsWhite = this.game.turn === 'w';
                    const isBottomTurn = (currentTurnIsWhite && whiteIsBottom) || (!currentTurnIsWhite && !whiteIsBottom);

                    if (isBottomTurn) {
                        this.bottomPlayerCard.classList.add('active-turn');
                        this.topPlayerCard.classList.remove('active-turn');
                    } else {
                        this.topPlayerCard.classList.add('active-turn');
                        this.bottomPlayerCard.classList.remove('active-turn');
                    }

                    const status = this.game.getGameStatus();
                    const activeBadge = isBottomTurn ? this.bottomStatusBadge : this.topStatusBadge;
                    const inactiveBadge = isBottomTurn ? this.topStatusBadge : this.bottomStatusBadge;

                    inactiveBadge.style.display = 'none';
                    inactiveBadge.className = 'player-status-badge';

                    if (status.isOver) {
                        this.topStatusBadge.style.display = 'inline-block';
                        this.bottomStatusBadge.style.display = 'inline-block';
                        if (status.winner === 'draw') {
                            this.topStatusBadge.textContent = 'Draw';
                            this.bottomStatusBadge.textContent = 'Draw';
                            this.topStatusBadge.className = 'player-status-badge game-over';
                            this.bottomStatusBadge.className = 'player-status-badge game-over';
                        } else {
                            const whiteWon = status.winner === 'White';
                            const bottomWon = (whiteWon && whiteIsBottom) || (!whiteWon && !whiteIsBottom);
                            if (bottomWon) {
                                this.bottomStatusBadge.textContent = 'Winner!';
                                this.bottomStatusBadge.className = 'player-status-badge game-over';
                                this.topStatusBadge.textContent = 'Checkmate';
                                this.topStatusBadge.className = 'player-status-badge in-check';
                            } else {
                                this.topStatusBadge.textContent = 'Winner!';
                                this.topStatusBadge.className = 'player-status-badge game-over';
                                this.bottomStatusBadge.textContent = 'Checkmate';
                                this.bottomStatusBadge.className = 'player-status-badge in-check';
                            }
                        }
                    } else {
                        activeBadge.style.display = 'inline-block';
                        if (this.hintText) {
                            activeBadge.textContent = this.hintText;
                            activeBadge.className = 'player-status-badge thinking';
                        } else if (status.inCheck) {
                            activeBadge.textContent = `Check! • M${this.game.fullMoves}`;
                            activeBadge.className = 'player-status-badge in-check';
                        } else if (!this.isHumanTurn()) {
                            activeBadge.textContent = `Thinking... • M${this.game.fullMoves}`;
                            activeBadge.className = 'player-status-badge thinking';
                        } else {
                            activeBadge.textContent = `To Move • M${this.game.fullMoves}`;
                            activeBadge.className = 'player-status-badge';
                        }
                    }

                    // Captured Pieces & Material Advantage
                    const captured = this.game.getCapturedSummary();
                    const renderCapturedRack = (container, pieceTypes, colorSymbol) => {
                        container.innerHTML = '';
                        pieceTypes.forEach(type => {
                            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                            svg.setAttribute('class', 'captured-piece');
                            svg.setAttribute('viewBox', '0 0 45 45');
                            const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                            const id = colorSymbol === 'w' ? type.toUpperCase() : type;
                            use.setAttribute('href', `#piece-${id}`);
                            svg.appendChild(use);
                            container.appendChild(svg);
                        });
                    };

                    const bottomLostPieces = whiteIsBottom ? captured.capturedWhite : captured.capturedBlack;
                    const topLostPieces = whiteIsBottom ? captured.capturedBlack : captured.capturedWhite;

                    renderCapturedRack(this.bottomCaptured, topLostPieces, whiteIsBottom ? 'b' : 'w');
                    renderCapturedRack(this.topCaptured, bottomLostPieces, whiteIsBottom ? 'w' : 'b');

                    const diffForBottom = whiteIsBottom ? captured.diff : -captured.diff;
                    if (diffForBottom > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'material-diff';
                        badge.textContent = `+${diffForBottom}`;
                        this.bottomCaptured.appendChild(badge);
                    } else if (diffForBottom < 0) {
                        const badge = document.createElement('span');
                        badge.className = 'material-diff';
                        badge.textContent = `+${Math.abs(diffForBottom)}`;
                        this.topCaptured.appendChild(badge);
                    }
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                window.einkChess = new EinkChessUI();
            });
        })();
    </script>
