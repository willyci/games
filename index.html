<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>e-readers Games</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-text-size-adjust: 100%;
    }

    .head {
      border-bottom: 3px solid #000;
      padding: 16px 16px 12px;
      text-align: center;
    }

    .head h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .head p {
      margin: 4px 0 0;
      font-size: 16px;
      color: #333;
    }

    .sec {
      margin: 18px 12px 0;
      padding: 0 0 6px;
      border-bottom: 2px solid #000;
      font-size: 20px;
      font-weight: bold;
    }

    .sec small {
      float: right;
      font-size: 15px;
      font-weight: normal;
      color: #444;
      line-height: 26px;
    }

    .grid {
      text-align: center;
      padding: 6px 4px 6px;
      font-size: 0;
    }

    .tile {
      display: inline-block;
      vertical-align: top;
      box-sizing: border-box;
      position: relative;
      width: 30%;
      margin: 1.5%;
      padding: 14px 4px 8px;
      border: 2px solid #000;
      border-radius: 8px;
      background: #fff;
      color: #000;
      box-shadow: 3px 3px 0 #000;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .tile:active {
      left: 3px;
      top: 3px;
      box-shadow: none;
      background: #ddd;
    }

    .tile svg {
      display: block;
      margin: 0 auto 8px;
      width: 68px;
      height: 68px;
    }

    .tile span {
      display: block;
      line-height: 1.2;
      min-height: 42px;
    }

    @media (min-width: 900px) {
      .tile {
        width: 22%;
      }
    }

    @media (max-width: 420px) {
      .tile {
        width: 46%;
      }
    }

    .foot {
      text-align: center;
      font-size: 14px;
      padding: 14px 10px 6px;
      color: #444;
    }

    .links {
      margin: 12px 12px 28px;
    }

    .links h2 {
      margin: 0 0 10px;
      padding: 0 0 6px;
      font-size: 20px;
      border-bottom: 2px solid #000;
    }

    .link {
      display: block;
      box-sizing: border-box;
      position: relative;
      margin: 0 2px 10px 0;
      padding: 10px 40px 10px 14px;
      min-height: 48px;
      border: 2px solid #000;
      border-radius: 8px;
      box-shadow: 3px 3px 0 #000;
      color: #000;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .link:after {
      content: "›";
      position: absolute;
      right: 14px;
      top: 50%;
      margin-top: -18px;
      font-size: 32px;
      line-height: 32px;
    }

    .link:active {
      left: 3px;
      top: 3px;
      box-shadow: none;
      background: #ddd;
    }

    .link small {
      display: block;
      font-size: 14px;
      font-weight: normal;
      color: #444;
      margin-top: 2px;
      word-wrap: break-word;
    }
  </style>
</head>

      function prettyName(file) {
        var n = file.replace(/\.html?$/i, '').replace(/[_\-]+/g, ' ');
        return n.replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
      }

      function genericIcon(name) {
        var letter = (name.charAt(0) || '?').toUpperCase();
        return svg('<rect x="6" y="6" width="52" height="52" ' + S + '/><text x="32" y="44" font-size="32" font-weight="bold" text-anchor="middle" font-family="Georgia,serif">' + letter + '</text>');
      }

      function nameOf(f) { return (META[f] && META[f].name) || prettyName(f); }

      function tile(f) {
        var m = META[f] || {}, name = nameOf(f);
        return '<a class="tile" href="' + encodeURI(f) + '">' + (m.icon || genericIcon(name)) + '<span>' + name + '</span></a>';
      }

      function render(files) {
        var have = {}, used = {}, i, j, f, html = '', total = 0, rest = [];
        for (i = 0; i < files.length; i++) if (files[i] && !IGNORE[files[i].toLowerCase()]) have[files[i]] = 1;
        function section(title, list) {
          if (!list.length) return;
          html += '<div class="sec">' + title + '<small>' + list.length + '</small></div><div class="grid">';
          for (var k = 0; k < list.length; k++) html += tile(list[k]);
          html += '</div>';
          total += list.length;
        }
        for (i = 0; i < SECTIONS.length; i++) {
          var list = [];
          for (j = 0; j < SECTIONS[i].files.length; j++) {
            f = SECTIONS[i].files[j];
            if (have[f] && !used[f]) { list.push(f); used[f] = 1; }
          }
          section(SECTIONS[i].title, list);
        }
        for (f in have) if (have.hasOwnProperty(f) && !used[f]) rest.push(f);
        rest.sort(function (a, b) { return nameOf(a).toLowerCase() < nameOf(b).toLowerCase() ? -1 : 1; });
        section('More', rest);
        document.getElementById('grid').innerHTML = html;
        document.getElementById('sub').innerHTML = total + ' games &middot; tap one to play';
        document.getElementById('foot').innerHTML = 'Made for e-ink screens: high contrast, no animations, big buttons.';
      }

      // Try to scan the folder live (works on servers that return a directory listing).
      function scan() {
        var x;
        try { x = new XMLHttpRequest(); x.open('GET', './', true); } catch (e) { return; }
        x.onreadystatechange = function () {
          if (x.readyState !== 4 || !(x.status === 200 || x.status === 0) || !x.responseText) return;
          var re = /href="([^"?#\/]+\.html?)"/gi, m, found = [];
          while ((m = re.exec(x.responseText))) found.push(decodeURIComponent(m[1]));
          // A real listing contains the index itself; a served index.html page would not.
          var hasIndex = false, i;
          for (i = 0; i < found.length; i++) if (found[i].toLowerCase() === 'index.html') hasIndex = true;
          if (hasIndex && found.length > 1) render(found);
        };
        try { x.send(null); } catch (e2) { }
      }

      render(FILES);
      scan();
    })();
  </script>
