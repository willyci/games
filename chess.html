<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Ink Chess — Human vs AI</title>
    <meta name="description"
        content="A high-contrast chess game designed specifically for E-Ink displays, e-readers, and monochrome screens with Staunton vector pieces, AI difficulty levels, and screen refresh.">
    <style>
        /* ==========================================================================
       E-INK DESIGN SYSTEM & THEMES
       High contrast, zero-smear, crisp vector rendering, authentic paper feel
       ========================================================================== */
        :root {
            /* Theme: Carta Paperwhite (Default) */
            --bg-page: #f6f5f0;
            --bg-panel: #ebe9e1;
            --bg-board-frame: #dfdcd3;
            --text-main: #141414;
            --text-muted: #555552;
            --border-ink: #222222;
            --border-light: #9c9a92;
            --sq-light: #ffffff;
            --sq-dark: #cac7bc;
            --sq-dark-pattern: none;
            --highlight-select: #111111;
            --highlight-select-text: #ffffff;
            --highlight-last-border: #111111;
            --hint-dot: #111111;
            --btn-bg: #fdfdfc;
            --btn-active-bg: #141414;
            --btn-active-text: #ffffff;
            --shadow-crisp: 2px 2px 0px #222222;
            --shadow-crisp-sm: 1px 1px 0px #222222;
            --piece-white-fill: #ffffff;
            --piece-white-stroke: #111111;
            --piece-black-fill: #141414;
            --piece-black-stroke: #ffffff;
            --font-serif: "Charter", "Bitstream Charter", "Georgia", "Cambria", "Times New Roman", serif;
            --font-mono: "Consolas", "Courier New", "Menlo", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Theme: 1-Bit Monochrome Dither (Pure B&W for e-paper) */
        body.theme-monochrome {
            --bg-page: #ffffff;
            --bg-panel: #ffffff;
            --bg-board-frame: #ffffff;
            --text-main: #000000;
            --text-muted: #000000;
            --border-ink: #000000;
            --border-light: #000000;
            --sq-light: #ffffff;
            --sq-dark: #ffffff;
            /* CSS cross-hatch pattern for 1-bit dark squares */
            --sq-dark-pattern: repeating-linear-gradient(45deg, #000000, #000000 1.5px, #ffffff 1.5px, #ffffff 6px);
            --highlight-select: #000000;
            --highlight-select-text: #ffffff;
            --highlight-last-border: #000000;
            --hint-dot: #000000;
            --btn-bg: #ffffff;
            --btn-active-bg: #000000;
            --btn-active-text: #ffffff;
            --shadow-crisp: 3px 3px 0px #000000;
            --shadow-crisp-sm: 2px 2px 0px #000000;
            --piece-white-fill: #ffffff;
            --piece-white-stroke: #000000;
            --piece-black-fill: #000000;
            --piece-black-stroke: #ffffff;
        }

        /* Theme: Slate 16-Gray (Classic Kindle/Palm) */
        body.theme-slate {
            --bg-page: #e2e2e2;
            --bg-panel: #d4d4d4;
            --bg-board-frame: #c4c4c4;
            --text-main: #0f0f0f;
            --text-muted: #4a4a4a;
            --border-ink: #1c1c1c;
            --border-light: #8a8a8a;
            --sq-light: #f5f5f5;
            --sq-dark: #a8a8a8;
            --sq-dark-pattern: none;
            --highlight-select: #1c1c1c;
            --highlight-select-text: #f5f5f5;
            --highlight-last-border: #1c1c1c;
            --hint-dot: #1c1c1c;
            --btn-bg: #f0f0f0;
            --btn-active-bg: #1c1c1c;
            --btn-active-text: #ffffff;
            --shadow-crisp: 2px 2px 0px #1c1c1c;
            --shadow-crisp-sm: 1px 1px 0px #1c1c1c;
        }

        /* Theme: Dark E-Ink (Night Reading) */
        body.theme-dark {
            --bg-page: #161616;
            --bg-panel: #202020;
            --bg-board-frame: #2c2c2c;
            --text-main: #f0f0f0;
            --text-muted: #b0b0b0;
            --border-ink: #f0f0f0;
            --border-light: #666666;
            --sq-light: #3e3e3e;
            --sq-dark: #222222;
            --sq-dark-pattern: none;
            --highlight-select: #f0f0f0;
            --highlight-select-text: #161616;
            --highlight-last-border: #f0f0f0;
            --hint-dot: #ffffff;
            --btn-bg: #2a2a2a;
            --btn-active-bg: #f0f0f0;
            --btn-active-text: #161616;
            --shadow-crisp: 2px 2px 0px #f0f0f0;
            --shadow-crisp-sm: 1px 1px 0px #f0f0f0;
            --piece-white-fill: #f5f5f5;
            --piece-white-stroke: #161616;
            --piece-black-fill: #161616;
            --piece-black-stroke: #f5f5f5;
        }

        /* Global reset - instant snap transitions, zero smear for E-Ink displays */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: none !important;
            animation-duration: 0s !important;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-serif);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 12px;
            overflow-x: hidden;
        }

        /* Clean modern SVG Icons */
        .ui-icon {
            width: 16px;
            height: 16px;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            display: inline-block;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .ui-icon-sm {
            width: 14px;
            height: 14px;
        }

        .ui-icon-lg {
            width: 24px;
            height: 24px;
        }

        /* ==========================================================================
       E-INK HARDWARE FLASH OVERLAY (DE-GHOSTING)
       Physically cycles electrophoretic microcapsules: Black -> White -> Normal
       ========================================================================== */
        #eink-flash-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
            display: none;
        }

        #eink-flash-overlay.flash-black {
            display: block;
            opacity: 1;
            background: #000000;
        }

        #eink-flash-overlay.flash-white {
            display: block;
            opacity: 1;
            background: #ffffff;
        }

        /* Container */
        .app-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* E-Ink Tactile Buttons */
        .eink-btn {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 2px solid var(--border-ink);
            padding: 7px 12px;
            font-family: var(--font-serif);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: var(--shadow-crisp-sm);
            min-height: 38px;
            white-space: nowrap;
        }

        .eink-btn:active,
        .eink-btn.active {
            background: var(--btn-active-bg);
            color: var(--btn-active-text);
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .eink-btn:focus-visible {
            outline: 2px dashed var(--border-ink);
            outline-offset: 2px;
        }

        .eink-btn-sm {
            padding: 4px 8px;
            font-size: 11px;
            min-height: 30px;
        }

        .eink-btn-primary {
            font-weight: 900;
            border-width: 2.5px;
        }

        /* Main Board Layout (Centered Board + Bottom Menu) */
        .main-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        /* Board Column */
        .board-column {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        /* Bottom Menu (Below the Board) */
        .bottom-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .action-bar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
        }

        a.eink-btn {
            text-decoration: none;
        }

        .action-bar-grid .eink-btn {
            min-height: 32px;
            font-size: 14px;
            padding: 3px 12px;
            gap: 6px;
        }

        .action-bar-grid .eink-btn .ui-icon {
            width: 16px;
            height: 16px;
            stroke-width: 2.2px;
        }

        @media (max-width: 520px) {
            .action-bar-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        @media (max-width: 620px) {
            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Player Status Card */
        .player-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel);
            border: 1.5px solid var(--border-ink);
            padding: 3px 10px;
            font-size: 14px;
            min-height: 32px;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .player-card.active-turn {
            border: 2.5px solid var(--border-ink);
            box-shadow: var(--shadow-crisp-sm);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-shrink: 1;
        }

        /* Name, status badge and meta all on one line */
        .player-info>div {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .player-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .player-name {
            font-weight: 700;
            white-space: nowrap;
        }

        .player-status-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1px 6px;
            border: 1.5px solid var(--border-ink);
            background: var(--bg-page);
            color: var(--text-main);
            display: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .player-card.active-turn .player-status-badge {
            display: inline-block;
        }

        .player-status-badge.in-check {
            background: #000000;
            color: #ffffff;
            border-color: #000000;
        }

        .player-status-badge.thinking {
            border-style: dashed;
        }

        .player-status-badge.game-over {
            background: var(--border-ink);
            color: var(--sq-light);
        }

        .player-meta {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            white-space: nowrap;
        }

        /* Captured pieces stay on one line, overlapping slightly so a long rack still fits */
        .captured-rack {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 14px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        .captured-piece {
            width: 20px;
            height: 20px;
            display: inline-block;
            flex-shrink: 0;
        }

        .captured-piece+.captured-piece {
            margin-left: -7px;
        }

        @media (max-width: 480px) {
            .player-meta {
                display: none;
            }

            .captured-piece {
                width: 16px;
                height: 16px;
            }
        }

        .material-diff {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 700;
            margin-left: 4px;
            padding: 1px 4px;
            border: 1px solid var(--border-ink);
            background: var(--bg-page);
        }

        /* The Board Frame */
        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg-board-frame);
            border: 3px solid var(--border-ink);
            box-shadow: var(--shadow-crisp);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Coordinate Labels */
        .coords-files {
            position: absolute;
            bottom: 2px;
            left: 20px;
            right: 20px;
            height: 16px;
            display: flex;
            justify-content: space-around;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            pointer-events: none;
        }

        .coords-ranks {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 4px;
            width: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            pointer-events: none;
        }

        /* 8x8 Chess Board */
        .chess-board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 1.5px solid var(--border-ink);
            box-sizing: border-box;
        }

        .square {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .square.light {
            background-color: var(--sq-light);
        }

        .square.dark {
            background-color: var(--sq-dark);
            background-image: var(--sq-dark-pattern);
        }

        /* Selected Square */
        .square.selected {
            outline: 3px solid var(--highlight-select);
            outline-offset: -3px;
            z-index: 10;
        }

        .square.selected::after {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1.5px dashed var(--highlight-select);
            pointer-events: none;
        }

        /* Last Move Squares */
        .square.last-move::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            border-top: 3px solid var(--highlight-last-border);
            border-left: 3px solid var(--highlight-last-border);
            pointer-events: none;
            z-index: 5;
        }

        .square.last-move::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-bottom: 3px solid var(--highlight-last-border);
            border-right: 3px solid var(--highlight-last-border);
            pointer-events: none;
            z-index: 5;
        }

        /* In Check King Square */
        .square.in-check {
            background-color: #000000 !important;
        }

        .square.in-check svg {
            filter: invert(1);
        }

        /* Legal Move Destination Hint */
        .move-hint {
            position: absolute;
            width: 26%;
            height: 26%;
            border-radius: 50%;
            background: var(--hint-dot);
            pointer-events: none;
            z-index: 8;
            border: 1.5px solid var(--sq-light);
        }

        /* Legal Move Capture Hint (Ring around the piece) */
        .capture-hint {
            position: absolute;
            inset: 4px;
            border: 3px solid var(--hint-dot);
            border-radius: 4px;
            pointer-events: none;
            z-index: 8;
        }

        /* Opponent Threat / Possible Move Indicator (Black Circle) */
        .threat-circle {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 58%;
            height: 58%;
            border: 3.5px solid #000000;
            border-radius: 50%;
            pointer-events: none;
            z-index: 7;
            box-sizing: border-box;
            box-shadow: 0 0 0 1.5px #ffffff, inset 0 0 0 1.5px #ffffff;
        }

        body.theme-dark .threat-circle {
            border-color: #ffffff;
            box-shadow: 0 0 0 1.5px #000000, inset 0 0 0 1.5px #000000;
        }

        /* Vector SVG Piece container */
        .piece-svg {
            width: 90%;
            height: 90%;
            pointer-events: none;
            display: block;
            transition: none;
            /* No smear for e-ink */
        }

        /* Dropdown controls row (direct, compact, space-saving) */
        .match-setup-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        /* Let the dropdowns shrink below their option-text width so the row never overflows */
        .match-setup-row .eink-select {
            flex: 1 1 0;
            min-width: 0;
            width: 100%;
            min-height: 32px;
            padding: 3px 6px;
            text-overflow: ellipsis;
        }

        .match-setup-row .eink-btn {
            flex: 0 0 auto;
            min-height: 32px;
            padding: 3px 10px;
        }

        @media (max-width: 480px) {
            .match-setup-row {
                gap: 4px;
            }
        }

        .eink-select {
            background: var(--btn-bg);
            color: var(--text-main);
            border: 2px solid var(--border-ink);
            padding: 6px 10px;
            font-family: var(--font-serif);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-crisp-sm);
        }

        /* E-Ink Specs Bar / Footer */
        footer.footer {
            margin-top: 14px;
            border-top: 2px solid var(--border-ink);
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            flex-wrap: wrap;
            gap: 8px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-page);
            border: 3px solid var(--border-ink);
            box-shadow: var(--shadow-crisp);
            padding: 20px;
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            border-bottom: 2px solid var(--border-ink);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .promotion-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 10px 0;
        }

        .promotion-option {
            background: var(--btn-bg);
            border: 2px solid var(--border-ink);
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: var(--shadow-crisp-sm);
        }

        .promotion-option:active {
            background: var(--border-ink);
            transform: translate(1px, 1px);
        }

        .promotion-option:active svg {
            filter: invert(1);
        }

        .promotion-piece-icon {
            width: 44px;
            height: 44px;
        }

        .promotion-label {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
        }

        .textarea-eink {
            width: 100%;
            height: 90px;
            border: 2px solid var(--border-ink);
            background: var(--sq-light);
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 6px;
            resize: vertical;
        }

        /* Print / High-DPI Tweaks */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }

            .match-setup-row,
            .footer {
                display: none !important;
            }

            .board-wrapper {
                box-shadow: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Fullscreen E-Ink Microcapsule Flash Overlay (Physical ghosting wipe) -->
    <div id="eink-flash-overlay"></div>

    <div class="app-container">
        <!-- Main Game Section: Centered Board + Bottom Controls -->
        <main class="main-layout">
            <!-- Left / Board Column -->
            <section class="board-column" aria-label="Chessboard Area">
                <!-- Top Player Card (Black / AI) -->
                <div class="player-card" id="top-player-card">
                    <div class="player-info">
                        <span class="player-badge black" id="top-badge"></span>
                        <div>
                            <div class="player-name-row">
                                <span class="player-name" id="top-name">Chess AI</span>
                                <span class="player-status-badge" id="top-status-badge"></span>
                            </div>
                            <div class="player-meta" id="top-meta">Level 2 (Club)</div>
                        </div>
                    </div>
                    <div class="captured-rack" id="top-captured">
                        <!-- Captured pieces shown here -->
                    </div>
                </div>

                <!-- The Chess Board Container -->
                <div class="board-wrapper">
                    <!-- Rank numbers (1-8) -->
                    <div class="coords-ranks" id="ranks-bar">
                        <span>8</span><span>7</span><span>6</span><span>5</span>
                        <span>4</span><span>3</span><span>2</span><span>1</span>
                    </div>

                    <!-- The 64 Board Squares -->
                    <div class="chess-board" id="board" role="grid" aria-label="Chess Board">
                        <!-- Dynamically populated 64 squares -->
                    </div>

                    <!-- File letters (A-H) -->
                    <div class="coords-files" id="files-bar">
                        <span>a</span><span>b</span><span>c</span><span>d</span>
                        <span>e</span><span>f</span><span>g</span><span>h</span>
                    </div>
                </div>

                <!-- Bottom Player Card (White / Human) -->
                <div class="player-card active-turn" id="bottom-player-card">
                    <div class="player-info">
                        <span class="player-badge white" id="bottom-badge"></span>
                        <div>
                            <div class="player-name-row">
                                <span class="player-name" id="bottom-name">Human Player</span>
                                <span class="player-status-badge" id="bottom-status-badge">To Move</span>
                            </div>
                            <div class="player-meta" id="bottom-meta">You</div>
                        </div>
                    </div>
                    <div class="captured-rack" id="bottom-captured">
                        <!-- Captured pieces shown here -->
                    </div>
                </div>
            </section>

            <!-- Bottom Controls (Directly below board) -->
            <section class="bottom-menu" aria-label="Game Controls">
                <!-- Primary Action Buttons Row (5 buttons) -->
                <div class="action-bar-grid">

                    <a class="eink-btn" id="btn-back" href="index.html" title="Back to game list">
                        <svg class="ui-icon" viewBox="0 0 24 24">
                            <polyline points="15 18 9 12 15 6" />
                        </svg>
                        <span>Back</span>
                    </a>

            'use strict';

            /* --- Audio Synthesizer (Zero External Dependencies) --- */
            class EinkSoundEngine {
                constructor() {
                    this.ctx = null;
                    this.enabled = false;
                }

                init() {
                    if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        this.ctx = new AudioCtx();
                    }
                    if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                playMove() {
                    if (!this.enabled) return;
                    this.init();
                    if (!this.ctx) return;
                    try {
                        // Tactile crisp wooden tap
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320, now);
                        osc.frequency.exponentialRampToValueAtTime(70, now + 0.05);

                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.06);
                    } catch (e) { }
                }

                playCapture() {
                    if (!this.enabled) return;
                    this.init();
                    if (!this.ctx) return;
                    try {
                        // Solid double clack
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(180, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);

                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.09);
                    } catch (e) { }
                }

                playCheck() {
                    if (!this.enabled) return;
                    this.init();
                    if (!this.ctx) return;
                    try {
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(587.33, now); // D5
                        osc.frequency.setValueAtTime(880, now + 0.08); // A5

                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.25);
                    } catch (e) { }
                }

                playEnd() {
                    if (!this.enabled) return;
                    this.init();
                    if (!this.ctx) return;
                    try {
                        const now = this.ctx.currentTime;
                        [440, 554.37, 659.25].forEach((freq, idx) => {
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                            gain.gain.setValueAtTime(0.25, now + idx * 0.09);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.25);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now + idx * 0.09);
                            osc.stop(now + idx * 0.09 + 0.3);
                        });
                    } catch (e) { }
                }

                    [-20, -10, -10, -5, -5, -10, -10, -20],
                    [-10, 0, 0, 0, 0, 0, 0, -10],
                    [-10, 0, 5, 5, 5, 5, 0, -10],
                    [-5, 0, 5, 5, 5, 5, 0, -5],
                    [0, 0, 5, 5, 5, 5, 0, -5],
                    [-10, 5, 5, 5, 5, 5, 0, -10],
                    [-10, 0, 5, 0, 0, 0, 0, -10],
                    [-20, -10, -10, -5, -5, -10, -10, -20]
                ],
                k: [
                    [-30, -40, -40, -50, -50, -40, -40, -30],
                    [-30, -40, -40, -50, -50, -40, -40, -30],
                    [-30, -40, -40, -50, -50, -40, -40, -30],
                    [-30, -40, -40, -50, -50, -40, -40, -30],
                    [-20, -30, -30, -40, -40, -30, -30, -20],
                    [-10, -20, -20, -20, -20, -20, -20, -10],
                    [20, 20, 0, 0, 0, 0, 20, 20],
                    [20, 30, 10, 0, 0, 10, 30, 20]
                ]
            };

            class ChessGame {
                constructor() {
                    this.board = [];
                    this.turn = 'w'; // 'w' or 'b'
                    this.castling = { K: true, Q: true, k: true, q: true };
                    this.enPassant = null; // { r, c }
                    this.halfMoves = 0;
                    this.fullMoves = 1;
                    this.history = []; // Array of moves
                    this.positionCounts = {}; // For threefold repetition
                    this.reset();
                }

                reset() {
                    this.board = Array(8).fill(null).map(() => Array(8).fill(null));
                    this.turn = 'w';
                    this.castling = { K: true, Q: true, k: true, q: true };
                    this.enPassant = null;
                    this.halfMoves = 0;
                    this.fullMoves = 1;
                    this.history = [];
                    this.positionCounts = {};
                    this.loadFEN('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1');
                }

                cloneBoard() {
                    return this.board.map(row => row.map(cell => cell ? { ...cell } : null));
                }

                loadFEN(fen) {
                    const parts = fen.trim().split(/\s+/);
                    if (parts.length < 1) return false;

                    const rows = parts[0].split('/');
                    if (rows.length !== 8) return false;

                    const newBoard = Array(8).fill(null).map(() => Array(8).fill(null));
                    for (let r = 0; r < 8; r++) {
                        let c = 0;
                        for (let char of rows[r]) {
                            if (/\d/.test(char)) {
                                c += parseInt(char, 10);
                            } else {
                                const color = char === char.toUpperCase() ? 'w' : 'b';
                                newBoard[r][c] = { type: char.toLowerCase(), color };
                                c++;
                            }
                        }
                    }

                    this.board = newBoard;
                    this.turn = parts[1] === 'b' ? 'b' : 'w';
                    this.updateKingCache();

                    this.castling = { K: false, Q: false, k: false, q: false };
                    if (parts[2] && parts[2] !== '-') {
                        if (parts[2].includes('K')) this.castling.K = true;
                        if (parts[2].includes('Q')) this.castling.Q = true;
                        if (parts[2].includes('k')) this.castling.k = true;
                        if (parts[2].includes('q')) this.castling.q = true;
                    }

                    this.enPassant = null;
                    if (parts[3] && parts[3] !== '-') {
                        const file = parts[3].charCodeAt(0) - 97;
                        const rank = 8 - parseInt(parts[3][1], 10);
                        if (file >= 0 && file < 8 && rank >= 0 && rank < 8) {
                            this.enPassant = { r: rank, c: file };
                        }
                    }

                    this.halfMoves = parts[4] ? parseInt(parts[4], 10) : 0;
                    this.fullMoves = parts[5] ? parseInt(parts[5], 10) : 1;
                    this.recordPosition();
                    return true;
                }

                generateFEN() {
                    let fen = '';
                    for (let r = 0; r < 8; r++) {
                        let empty = 0;
                        for (let c = 0; c < 8; c++) {
                            const piece = this.board[r][c];
                            if (!piece) {
                                empty++;
                            } else {
                                if (empty > 0) {
                                    fen += empty;
                                    empty = 0;
                                }
                                fen += piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                            }
                        }
                        if (empty > 0) fen += empty;
                        if (r < 7) fen += '/';
                    }

                    fen += ' ' + this.turn;

                    let castlingStr = '';
                    if (this.castling.K) castlingStr += 'K';
                    if (this.castling.Q) castlingStr += 'Q';
                    if (this.castling.k) castlingStr += 'k';
                    if (this.castling.q) castlingStr += 'q';
                    fen += ' ' + (castlingStr || '-');

                    if (this.enPassant) {
                        const file = String.fromCharCode(97 + this.enPassant.c);
                        const rank = 8 - this.enPassant.r;
                        fen += ` ${file}${rank}`;
                    } else {
                        fen += ' -';
                    }

                    fen += ` ${this.halfMoves} ${this.fullMoves}`;
                    return fen;
                }

                getPositionKey() {
                    let key = '';
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            key += p ? (p.color + p.type) : '.';
                        }
                    }
                    key += `_${this.turn}_${this.castling.K ? 'K' : ''}${this.castling.Q ? 'Q' : ''}${this.castling.k ? 'k' : ''}${this.castling.q ? 'q' : ''}`;
                    if (this.enPassant) key += `_${this.enPassant.r}${this.enPassant.c}`;
                    return key;
                }

                recordPosition() {
                    const key = this.getPositionKey();
                    this.positionCounts[key] = (this.positionCounts[key] || 0) + 1;
                }

                unrecordPosition() {
                    const key = this.getPositionKey();
                    if (this.positionCounts[key]) {
                        this.positionCounts[key]--;
                        if (this.positionCounts[key] <= 0) delete this.positionCounts[key];
                    }
                }

                isSquareAttacked(targetR, targetC, attackerColor) {
                    // Pawn attacks
                    const pawnDir = attackerColor === 'w' ? 1 : -1;
                    const pR = targetR + pawnDir;
                    if (pR >= 0 && pR < 8) {
                        if (targetC - 1 >= 0) {
                            const p = this.board[pR][targetC - 1];
                            if (p && p.color === attackerColor && p.type === 'p') return true;
                        }
                        if (targetC + 1 < 8) {
                            const p = this.board[pR][targetC + 1];
                            if (p && p.color === attackerColor && p.type === 'p') return true;
                        }
                    }

                    // Knight attacks
                    const knightMoves = [
                        [-2, -1], [-2, 1], [-1, -2], [-1, 2],
                        [1, -2], [1, 2], [2, -1], [2, 1]
                    ];
                    for (let [dr, dc] of knightMoves) {
                        const nr = targetR + dr;
                        const nc = targetC + dc;
                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const p = this.board[nr][nc];
                            if (p && p.color === attackerColor && p.type === 'n') return true;
                        }
                    }

                    // King attacks (adjacent squares)
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = targetR + dr;
                            const nc = targetC + dc;
                            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                const p = this.board[nr][nc];
                                if (p && p.color === attackerColor && p.type === 'k') return true;
                            }
                        }
                    }

                    // Orthogonal rays (Rook / Queen)
                    const orthoDirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                    for (let [dr, dc] of orthoDirs) {
                        let nr = targetR + dr;
                        let nc = targetC + dc;
                        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const p = this.board[nr][nc];
                            if (p) {
                                if (p.color === attackerColor && (p.type === 'r' || p.type === 'q')) return true;
                                break;
                            }
                            nr += dr;
                            nc += dc;
                        }
                    }

                    // Diagonal rays (Bishop / Queen)
                    const diagDirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
                    for (let [dr, dc] of diagDirs) {
                        let nr = targetR + dr;
                        let nc = targetC + dc;
                        while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                            const p = this.board[nr][nc];
                            if (p) {
                                if (p.color === attackerColor && (p.type === 'b' || p.type === 'q')) return true;
                                break;
                            }
                            nr += dr;
                            nc += dc;
                        }
                    }

                    return false;
                }

                // King squares are cached (updated in makeMove/undoMove) to avoid a board scan per legality check
                updateKingCache() {
                    this.kings = { w: null, b: null };
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (p && p.type === 'k') this.kings[p.color] = { r, c };
                        }
                    }
                }

                getKingPosition(color) {
                    return this.kings[color];
                }

                isInCheck(color) {
                    const king = this.getKingPosition(color);
                    if (!king) return false;
                    const opponent = color === 'w' ? 'b' : 'w';
                    return this.isSquareAttacked(king.r, king.c, opponent);
                }

                getOpponentThreatSquares(opponentColor) {
                    const threatSquares = new Set();
                    const forward = opponentColor === 'w' ? -1 : 1;
                    const startRank = opponentColor === 'w' ? 6 : 1;

                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (!p || p.color !== opponentColor) continue;

                            if (p.type === 'p') {
                                // Pawn diagonal attacks (squares where opponent can capture you)
                                for (let dc of [-1, 1]) {
                                    const nr = r + forward;
                                    const nc = c + dc;
                                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                        threatSquares.add(`${nr},${nc}`);
                                    }
                                }
                                // Pawn forward moves (squares opponent can advance to)
                                const nr = r + forward;
                                if (nr >= 0 && nr < 8 && !this.board[nr][c]) {
                                    threatSquares.add(`${nr},${c}`);
                                    if (r === startRank) {
                                        const nnr = r + forward * 2;
                                        if (!this.board[nnr][c]) {
                                            threatSquares.add(`${nnr},${c}`);
                                        }
                                    }
                                }
                            } else if (p.type === 'n') {
                                const knightDeltas = [
                                    [-2, -1], [-2, 1], [-1, -2], [-1, 2],
                                    [1, -2], [1, 2], [2, -1], [2, 1]
                                ];
                                for (let [dr, dc] of knightDeltas) {
                                    const nr = r + dr;
                                    const nc = c + dc;
                                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                        const target = this.board[nr][nc];
                                        if (!target || target.color !== opponentColor) {
                                            threatSquares.add(`${nr},${nc}`);
                                        }
                                    }
                                }
                            } else if (p.type === 'k') {
                                for (let dr = -1; dr <= 1; dr++) {
                                    for (let dc = -1; dc <= 1; dc++) {
                                        if (dr === 0 && dc === 0) continue;
                                        const nr = r + dr;
                                        const nc = c + dc;
                                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                            const target = this.board[nr][nc];
                                            if (!target || target.color !== opponentColor) {
                                                threatSquares.add(`${nr},${nc}`);
                                            }
                                        }
                                    }
                                }
                            } else {
                                // Sliders: rook, bishop, queen
                                const dirs = [];
                                if (p.type === 'r' || p.type === 'q') {
                                    dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);
                                }
                                if (p.type === 'b' || p.type === 'q') {
                                    dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
                                }
                                for (let [dr, dc] of dirs) {
                                    let nr = r + dr;
                                    let nc = c + dc;
                                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                        const target = this.board[nr][nc];
                                        if (!target) {
                                            threatSquares.add(`${nr},${nc}`);
                                        } else {
                                            if (target.color !== opponentColor) {
                                                threatSquares.add(`${nr},${nc}`);
                                            }
                                            break;
                                        }
                                        nr += dr;
                                        nc += dc;
                                    }
                                }
                            }
                        }
                    }

                    // Opponent castling destinations
                    if (this.castling) {
                        const r = opponentColor === 'w' ? 7 : 0;
                        const kKey = opponentColor === 'w' ? 'K' : 'k';
                        const qKey = opponentColor === 'w' ? 'Q' : 'q';
                        if (this.castling[kKey] && !this.board[r][5] && !this.board[r][6]) {
                            threatSquares.add(`${r},6`);
                        }
                        if (this.castling[qKey] && !this.board[r][1] && !this.board[r][2] && !this.board[r][3]) {
                            threatSquares.add(`${r},2`);
                        }
                    }

                    return Array.from(threatSquares).map(coord => {
                        const [r, c] = coord.split(',').map(Number);
                        return { r, c };
                    });
                }

                getPseudoMoves(color) {
                    const moves = [];
                    const forward = color === 'w' ? -1 : 1;
                    const startRank = color === 'w' ? 6 : 1;
                    const promoRank = color === 'w' ? 0 : 7;
                    const opponent = color === 'w' ? 'b' : 'w';

                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (!p || p.color !== color) continue;

                            // --- PAWN ---
                            if (p.type === 'p') {
                                const nr = r + forward;
                                if (nr >= 0 && nr < 8 && !this.board[nr][c]) {
                                    if (nr === promoRank) {
                                        ['q', 'r', 'b', 'n'].forEach(promo => {
                                            moves.push({ from: { r, c }, to: { r: nr, c }, promotion: promo });
                                        });
                                    } else {
                                        moves.push({ from: { r, c }, to: { r: nr, c } });
                                        if (r === startRank) {
                                            const nnr = r + forward * 2;
                                            if (!this.board[nnr][c]) {
                                                moves.push({ from: { r, c }, to: { r: nnr, c }, doublePawn: true });
                                            }
                                        }
                                    }
                                }

                                for (let dc of [-1, 1]) {
                                    const nc = c + dc;
                                    if (nc >= 0 && nc < 8 && nr >= 0 && nr < 8) {
                                        const target = this.board[nr][nc];
                                        if (target && target.color === opponent) {
                                            if (nr === promoRank) {
                                                ['q', 'r', 'b', 'n'].forEach(promo => {
                                                    moves.push({ from: { r, c }, to: { r: nr, c: nc }, promotion: promo, capture: target });
                                                });
                                            } else {
                                                moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: target });
                                            }
                                        } else if (this.enPassant && this.enPassant.r === nr && this.enPassant.c === nc) {
                                            moves.push({
                                                from: { r, c },
                                                to: { r: nr, c: nc },
                                                isEnPassant: true,
                                                capture: { type: 'p', color: opponent }
                                            });
                                        }
                                    }
                                }
                            }

                            // --- KNIGHT ---
                            else if (p.type === 'n') {
                                const knightMoves = [
                                    [-2, -1], [-2, 1], [-1, -2], [-1, 2],
                                    [1, -2], [1, 2], [2, -1], [2, 1]
                                ];
                                for (let [dr, dc] of knightMoves) {
                                    const nr = r + dr;
                                    const nc = c + dc;
                                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                        const target = this.board[nr][nc];
                                        if (!target) {
                                            moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                                        } else if (target.color === opponent) {
                                            moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: target });
                                        }
                                    }
                                }
                            }

                            // --- BISHOP / ROOK / QUEEN ---
                            else if (p.type === 'b' || p.type === 'r' || p.type === 'q') {
                                const dirs = [];
                                if (p.type === 'b' || p.type === 'q') {
                                    dirs.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
                                }
                                if (p.type === 'r' || p.type === 'q') {
                                    dirs.push([-1, 0], [1, 0], [0, -1], [0, 1]);
                                }

                                for (let [dr, dc] of dirs) {
                                    let nr = r + dr;
                                    let nc = c + dc;
                                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                        const target = this.board[nr][nc];
                                        if (!target) {
                                            moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                                        } else {
                                            if (target.color === opponent) {
                                                moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: target });
                                            }
                                            break;
                                        }
                                        nr += dr;
                                        nc += dc;
                                    }
                                }
                            }

                            // --- KING ---
                            else if (p.type === 'k') {
                                for (let dr = -1; dr <= 1; dr++) {
                                    for (let dc = -1; dc <= 1; dc++) {
                                        if (dr === 0 && dc === 0) continue;
                                        const nr = r + dr;
                                        const nc = c + dc;
                                        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                                            const target = this.board[nr][nc];
                                            if (!target) {
                                                moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                                            } else if (target.color === opponent) {
                                                moves.push({ from: { r, c }, to: { r: nr, c: nc }, capture: target });
                                            }
                                        }
                                    }
                                }

                                // Castling
                                if (color === 'w' && r === 7 && c === 4) {
                                    if (this.castling.K && !this.board[7][5] && !this.board[7][6]) {
                                        moves.push({ from: { r: 7, c: 4 }, to: { r: 7, c: 6 }, isCastle: 'K' });
                                    }
                                    if (this.castling.Q && !this.board[7][3] && !this.board[7][2] && !this.board[7][1]) {
                                        moves.push({ from: { r: 7, c: 4 }, to: { r: 7, c: 2 }, isCastle: 'Q' });
                                    }
                                } else if (color === 'b' && r === 0 && c === 4) {
                                    if (this.castling.k && !this.board[0][5] && !this.board[0][6]) {
                                        moves.push({ from: { r: 0, c: 4 }, to: { r: 0, c: 6 }, isCastle: 'k' });
                                    }
                                    if (this.castling.q && !this.board[0][3] && !this.board[0][2] && !this.board[0][1]) {
                                        moves.push({ from: { r: 0, c: 4 }, to: { r: 0, c: 2 }, isCastle: 'q' });
                                    }
                                }
                            }
                        }
                    }

                    return moves;
                }

                // track=false skips repetition bookkeeping (used for search/legality probes, which are always undone)
                makeMove(move, track = true) {
                    const piece = this.board[move.from.r][move.from.c];
                    const captured = move.capture ? { ...move.capture } : null;

                    const undoState = {
                        move: { ...move },
                        piece: { ...piece },
                        captured: captured,
                        castling: { ...this.castling },
                        enPassant: this.enPassant ? { ...this.enPassant } : null,
                        halfMoves: this.halfMoves,
                        fullMoves: this.fullMoves,
                        track: track
                    };

                    if (track) this.unrecordPosition();

                    this.board[move.from.r][move.from.c] = null;

                    if (move.isEnPassant) {
                        this.board[move.from.r][move.to.c] = null;
                    }

                    if (move.isCastle) {
                        if (move.isCastle === 'K') {
                            this.board[7][5] = this.board[7][7];
                            this.board[7][7] = null;
                        } else if (move.isCastle === 'Q') {
                            this.board[7][3] = this.board[7][0];
                            this.board[7][0] = null;
                        } else if (move.isCastle === 'k') {
                            this.board[0][5] = this.board[0][7];
                            this.board[0][7] = null;
                        } else if (move.isCastle === 'q') {
                            this.board[0][3] = this.board[0][0];
                            this.board[0][0] = null;
                        }
                    }

                    if (move.promotion) {
                        this.board[move.to.r][move.to.c] = { type: move.promotion, color: piece.color };
                    } else {
                        this.board[move.to.r][move.to.c] = piece;
                    }

                    if (piece.type === 'k') {
                        this.kings[piece.color] = { r: move.to.r, c: move.to.c };
                        if (piece.color === 'w') {
                            this.castling.K = false;
                            this.castling.Q = false;
                        } else {
                            this.castling.k = false;
                            this.castling.q = false;
                        }
                    } else if (piece.type === 'r') {
                        if (move.from.r === 7 && move.from.c === 0) this.castling.Q = false;
                        if (move.from.r === 7 && move.from.c === 7) this.castling.K = false;
                        if (move.from.r === 0 && move.from.c === 0) this.castling.q = false;
                        if (move.from.r === 0 && move.from.c === 7) this.castling.k = false;
                    }
                    if (move.to.r === 7 && move.to.c === 0) this.castling.Q = false;
                    if (move.to.r === 7 && move.to.c === 7) this.castling.K = false;
                    if (move.to.r === 0 && move.to.c === 0) this.castling.q = false;
                    if (move.to.r === 0 && move.to.c === 7) this.castling.k = false;

                    if (move.doublePawn) {
                        this.enPassant = { r: (move.from.r + move.to.r) / 2, c: move.from.c };
                    } else {
                        this.enPassant = null;
                    }

                    if (piece.type === 'p' || move.capture) {
                        this.halfMoves = 0;
                    } else {
                        this.halfMoves++;
                    }

                    if (this.turn === 'b') {
                        this.fullMoves++;
                    }

                    this.turn = this.turn === 'w' ? 'b' : 'w';
                    if (track) this.recordPosition();

                    return undoState;
                }

                undoMove(undoState) {
                    if (undoState.track) this.unrecordPosition();

                    const m = undoState.move;
                    this.turn = undoState.piece.color;
                    this.castling = { ...undoState.castling };
                    this.enPassant = undoState.enPassant ? { ...undoState.enPassant } : null;
                    this.halfMoves = undoState.halfMoves;
                    this.fullMoves = undoState.fullMoves;

                    this.board[m.from.r][m.from.c] = undoState.piece;
                    this.board[m.to.r][m.to.c] = undoState.captured;
                    if (undoState.piece.type === 'k') {
                        this.kings[undoState.piece.color] = { r: m.from.r, c: m.from.c };
                    }

                    if (m.isEnPassant) {
                        this.board[m.to.r][m.to.c] = null;
                        this.board[m.from.r][m.to.c] = undoState.captured;
                    }

                    if (m.isCastle) {
                        if (m.isCastle === 'K') {
                            this.board[7][7] = this.board[7][5];
                            this.board[7][5] = null;
                        } else if (m.isCastle === 'Q') {
                            this.board[7][0] = this.board[7][3];
                            this.board[7][3] = null;
                        } else if (m.isCastle === 'k') {
                            this.board[0][7] = this.board[0][5];
                            this.board[0][5] = null;
                        } else if (m.isCastle === 'q') {
                            this.board[0][0] = this.board[0][3];
                            this.board[0][3] = null;
                        }
                    }

                    if (undoState.track) this.recordPosition();
                }

                // Castling may not start from, pass through, or land on an attacked square
                isCastleSafe(move, color) {
                    const opponent = color === 'w' ? 'b' : 'w';
                    if (this.isInCheck(color)) return false;
                    const r = move.from.r;
                    if (move.isCastle === 'K' || move.isCastle === 'k') {
                        return !this.isSquareAttacked(r, 5, opponent) && !this.isSquareAttacked(r, 6, opponent);
                    }
                    return !this.isSquareAttacked(r, 3, opponent) && !this.isSquareAttacked(r, 2, opponent);
                }

                // Plays a pseudo-legal move without repetition tracking; returns its undo state, or null if illegal
                tryMove(move, color) {
                    if (move.isCastle && !this.isCastleSafe(move, color)) return null;
                    const undoState = this.makeMove(move, false);
                    if (this.isInCheck(color)) {
                        this.undoMove(undoState);
                        return null;
                    }
                    return undoState;
                }

                getLegalMoves(color = this.turn) {
                    const pseudo = this.getPseudoMoves(color);
                    const legal = [];

                    for (let move of pseudo) {
                        const undoState = this.tryMove(move, color);
                        if (undoState) {
                            legal.push(move);
                            this.undoMove(undoState);
                        }
                    }

                    return legal;
                }

                generateSAN(move, legalMovesBefore) {
                    if (move.isCastle === 'K' || move.isCastle === 'k') return 'O-O';
                    if (move.isCastle === 'Q' || move.isCastle === 'q') return 'O-O-O';

                    const piece = this.board[move.from.r][move.from.c];
                    const toSquare = String.fromCharCode(97 + move.to.c) + (8 - move.to.r);
                    let san = '';

                    if (piece.type === 'p') {
                        if (move.capture) {
                            san += String.fromCharCode(97 + move.from.c) + 'x' + toSquare;
                        } else {
                            san += toSquare;
                        }
                        if (move.promotion) {
                            san += '=' + move.promotion.toUpperCase();
                        }
                    } else {
                        san += piece.type.toUpperCase();

                        const samePieces = legalMovesBefore.filter(m =>
                            m.to.r === move.to.r && m.to.c === move.to.c &&
                            (m.from.r !== move.from.r || m.from.c !== move.from.c) &&
                            this.board[m.from.r][m.from.c].type === piece.type
                        );

                        if (samePieces.length > 0) {
                            const sameFile = samePieces.some(m => m.from.c === move.from.c);
                            const sameRank = samePieces.some(m => m.from.r === move.from.r);

                            if (!sameFile) {
                                san += String.fromCharCode(97 + move.from.c);
                            } else if (!sameRank) {
                                san += (8 - move.from.r);
                            } else {
                                san += String.fromCharCode(97 + move.from.c) + (8 - move.from.r);
                            }
                        }

                        if (move.capture) san += 'x';
                        san += toSquare;
                    }

                    const undoState = this.makeMove(move, false);
                    const opponent = piece.color === 'w' ? 'b' : 'w';
                    if (this.isInCheck(opponent)) {
                        const nextLegal = this.getLegalMoves(opponent);
                        if (nextLegal.length === 0) {
                            san += '#';
                        } else {
                            san += '+';
                        }
                    }
                    this.undoMove(undoState);

                    return san;
                }

                executeMove(move) {
                    const legalBefore = this.getLegalMoves(this.turn);
                    const san = this.generateSAN(move, legalBefore);
                    const fenBefore = this.generateFEN();
                    const capturedPiece = move.capture ? { ...move.capture } : null;

                    const undoState = this.makeMove(move);

                    const historyEntry = {
                        move: { ...move },
                        san: san,
                        fenBefore: fenBefore,
                        undoState: undoState,
                        captured: capturedPiece,
                        boardSnapshot: this.cloneBoard(),
                        turnAfter: this.turn
                    };

                    this.history.push(historyEntry);
                    return historyEntry;
                }

                undoLastMove() {
                    if (this.history.length === 0) return null;
                    const last = this.history.pop();
                    this.undoMove(last.undoState);
                    return last;
                }

                getCapturedSummary() {
                    const initial = { p: 8, n: 2, b: 2, r: 2, q: 1 };
                    const currentW = { p: 0, n: 0, b: 0, r: 0, q: 0 };
                    const currentB = { p: 0, n: 0, b: 0, r: 0, q: 0 };

                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (p && p.type !== 'k') {
                                if (p.color === 'w') currentW[p.type]++;
                                else currentB[p.type]++;
                            }
                        }
                    }

                    const capturedWhite = [];
                    const capturedBlack = [];

                    let scoreW = 0;
                    let scoreB = 0;

                    ['q', 'r', 'b', 'n', 'p'].forEach(type => {
                        const missingW = Math.max(0, initial[type] - currentW[type]);
                        const missingB = Math.max(0, initial[type] - currentB[type]);
                        for (let i = 0; i < missingW; i++) capturedWhite.push(type);
                        for (let i = 0; i < missingB; i++) capturedBlack.push(type);

                        scoreW += currentW[type] * PIECE_VALUES[type];
                        scoreB += currentB[type] * PIECE_VALUES[type];
                    });

                    return {
                        capturedWhite,
                        capturedBlack,
                        diff: (scoreW - scoreB) / 100
                    };
                }

                getGameStatus() {
                    const legal = this.getLegalMoves(this.turn);
                    const inCheck = this.isInCheck(this.turn);

                    if (legal.length === 0) {
                        if (inCheck) {
                            return {
                                isOver: true,
                                winner: this.turn === 'w' ? 'Black' : 'White',
                                reason: 'checkmate',
                                text: `Checkmate! ${this.turn === 'w' ? 'Black' : 'White'} wins.`
                            };
                        } else {
                            return {
                                isOver: true,
                                winner: 'draw',
                                reason: 'stalemate',
                                text: 'Draw by Stalemate.'
                            };
                        }
                    }

                    if (this.halfMoves >= 100) {
                        return {
                            isOver: true,
                            winner: 'draw',
                            reason: '50-move',
                            text: 'Draw by 50-move rule.'
                        };
                    }

                    const key = this.getPositionKey();
                    if (this.positionCounts[key] >= 3) {
                        return {
                            isOver: true,
                            winner: 'draw',
                            reason: 'threefold',
                            text: 'Draw by Threefold Repetition.'
                        };
                    }

                    if (this.isInsufficientMaterial()) {
                        return {
                            isOver: true,
                            winner: 'draw',
                            reason: 'insufficient',
                            text: 'Draw by Insufficient Material.'
                        };
                    }

                    return {
                        isOver: false,
                        inCheck: inCheck,
                        text: inCheck ? `${this.turn === 'w' ? 'White' : 'Black'} is in Check!` : `${this.turn === 'w' ? 'White' : 'Black'} to move.`
                    };
                }

                isInsufficientMaterial() {
                    const pieces = [];
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (p) pieces.push({ ...p, r, c });
                        }
                    }
                    if (pieces.length === 2) return true; // K vs K
                    if (pieces.length === 3) {
                        const nonKing = pieces.find(p => p.type !== 'k');
                        if (nonKing && (nonKing.type === 'b' || nonKing.type === 'n')) return true;
                    }
                    if (pieces.length === 4) {
                        const bishops = pieces.filter(p => p.type === 'b');
                        if (bishops.length === 2 && bishops[0].color !== bishops[1].color) {
                            const sq1 = (bishops[0].r + bishops[0].c) % 2;
                            const sq2 = (bishops[1].r + bishops[1].c) % 2;
                            if (sq1 === sq2) return true;
                        }
                    }
                    return false;
                }

                /* --- Positional Evaluation --- */
                evaluate() {
                    let score = 0;
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = this.board[r][c];
                            if (!p) continue;
                            const val = PIECE_VALUES[p.type];
                            const pstTable = PST[p.type];
                            const pstVal = p.color === 'w' ? pstTable[r][c] : pstTable[7 - r][c];
                            const totalPieceVal = val + pstVal;
                            if (p.color === 'w') {
                                score += totalPieceVal;
                            } else {
                                score -= totalPieceVal;
                            }
                        }
                    }
                    return score;
                }
            }

            /* ==========================================================================
               AI MINIMAX & QUIESCENCE ENGINE
               ========================================================================== */
            class ChessAI {
                constructor(game) {
                    this.game = game;
                }

                scoreMove(move) {
                    if (move.capture) {
                        const attacker = this.game.board[move.from.r][move.from.c];
                        const victim = move.capture;
                        return PIECE_VALUES[victim.type] * 10 - PIECE_VALUES[attacker.type];
                    }
                    if (move.promotion) return 800;
                    return 0;
                }

                // Sort by MVV-LVA score (computed once per move, not per comparison)
                orderMoves(moves) {
                    for (let m of moves) m.orderScore = this.scoreMove(m);
                    return moves.sort((a, b) => b.orderScore - a.orderScore);
                }

                // Checks the clock every 256 nodes; once time is up the whole search unwinds
                timeUp() {
                    if ((++this.nodes & 255) === 0 && Date.now() > this.deadline) this.aborted = true;
                    return this.aborted;
                }

                quiescence(alpha, beta, isMaximizing, qDepth = 0) {
                    if (this.timeUp()) return 0;
                    const standPat = this.game.evaluate();
                    if (qDepth >= 4) return standPat;

                    if (isMaximizing) {
                        if (standPat >= beta) return beta;
                        if (standPat > alpha) alpha = standPat;
                    } else {
                        if (standPat <= alpha) return alpha;
                        if (standPat < beta) beta = standPat;
                    }

                    const color = isMaximizing ? 'w' : 'b';
                    const moves = this.orderMoves(this.game.getPseudoMoves(color)
                        .filter(m => m.capture || m.promotion === 'q'));

                    for (let move of moves) {
                        const undo = this.game.tryMove(move, color);
                        if (!undo) continue;
                        const score = this.quiescence(alpha, beta, !isMaximizing, qDepth + 1);
                        this.game.undoMove(undo);
                        if (this.aborted) return 0;
                        if (isMaximizing) {
                            if (score >= beta) return beta;
                            if (score > alpha) alpha = score;
                        } else {
                            if (score <= alpha) return alpha;
                            if (score < beta) beta = score;
                        }
                    }
                    return isMaximizing ? alpha : beta;
                }

                minimax(depth, alpha, beta, isMaximizing, useQuiescence, ply) {
                    if (this.timeUp()) return 0;
                    if (this.game.halfMoves >= 100) return 0;

                    if (depth === 0) {
                        return useQuiescence ? this.quiescence(alpha, beta, isMaximizing) : this.game.evaluate();
                    }

                    // Pseudo-legal generation + legality check on make: no separate legal-move pass per node
                    const color = isMaximizing ? 'w' : 'b';
                    const moves = this.orderMoves(this.game.getPseudoMoves(color));
                    let legalCount = 0;
                    let best = isMaximizing ? -Infinity : Infinity;

                    for (let move of moves) {
                        const undo = this.game.tryMove(move, color);
                        if (!undo) continue;
                        legalCount++;
                        const ev = this.minimax(depth - 1, alpha, beta, !isMaximizing, useQuiescence, ply + 1);
                        this.game.undoMove(undo);
                        if (this.aborted) return 0;
                        if (isMaximizing) {
                            if (ev > best) best = ev;
                            if (ev > alpha) alpha = ev;
                        } else {
                            if (ev < best) best = ev;
                            if (ev < beta) beta = ev;
                        }
                        if (beta <= alpha) break;
                    }

                    if (legalCount === 0) {
                        // Checkmate (prefer faster mates via ply) or stalemate
                        if (!this.game.isInCheck(color)) return 0;
                        return isMaximizing ? -100000 + ply : 100000 - ply;
                    }
                    return best;
                }

                findBestMove(level, color, callback, isStale) {
                    setTimeout(() => {
                        // Bail out if the game was reset/changed while waiting, before touching the board
                        if (isStale && isStale()) return;
