<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lights Out</title>
<style>
/* ===== Shared e-ink game style (keep in sync across games) ===== */
html, body { margin: 0; padding: 0; background: #fff; color: #000; }
body {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}
.app-container {
  width: 100%; max-width: 680px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 8px;
}
.main-layout {
  display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%;
}
.board-column {
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%;
}
.bottom-menu {
  display: flex; flex-direction: column; gap: 6px; width: 100%;
}
.action-bar-grid {
  display: flex; flex-wrap: wrap; gap: 6px; width: 100%; justify-content: center;
}
.action-bar-grid .btn {
  flex: 1 1 0; min-width: 60px; margin: 0;
}
.match-setup-row {
  display: flex; gap: 6px; width: 100%; justify-content: center;
}
.match-setup-row select.btn {
  flex: 1 1 0; min-width: 0; margin: 0;
}
.btn {
  display: inline-block; box-sizing: border-box; position: relative;
  min-width: 48px; min-height: 38px; line-height: 34px;
  padding: 0 10px; margin: 2px;
  border: 2px solid #000; border-radius: 6px; background: #fff; color: #000;
  box-shadow: 2px 2px 0 #000;
  font-family: Georgia, "Times New Roman", serif; font-size: 16px; font-weight: bold;
  text-decoration: none; text-align: center; vertical-align: middle;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.btn:active, .btn.on { background: #000; color: #fff; }
.btn:active { left: 1px; top: 1px; box-shadow: none; }
.btn[disabled] { border-style: dashed; color: #888; box-shadow: none; left: 0; top: 0; background: #fff; }
select.btn {
  padding: 0 32px 0 10px; text-align: left;
  background: #fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='34' height='8'%3E%3Cpath d='M12 0h12L18 8z'/%3E%3C/svg%3E") no-repeat 100% 50%;
}
select.btn:active { color: #000; background-color: #fff; }
.status {
  text-align: center; font-size: 16px; line-height: 1.25; padding: 6px 10px; min-height: 22px;
  background: #eee; border: 1.5px solid #000; border-radius: 4px; width: 100%; box-sizing: border-box;
}
.status.win { background: #000; color: #fff; font-weight: bold; }
.wrap { text-align: center; padding: 6px 0 4px; width: 100%; }
.help {
  font-size: 15px; line-height: 1.4; margin: 6px 0 16px; padding: 0 12px 10px;
  border: 2px solid #000; border-radius: 6px; overflow: hidden;
}
.help.closed { height: 40px; padding-bottom: 0; }
.help h2 {
  font-size: 16px; margin: 0 -12px 6px; padding: 0 12px; height: 40px; line-height: 40px;
  border-bottom: 1px solid #000; cursor: pointer;
}
.help h2:after { content: "▴"; float: right; font-size: 18px; }
.help.closed h2:after { content: "+"; }
/* ===== Game specific ===== */
table.board { border-collapse: collapse; margin: 0 auto; border: 3px solid #000; }
table.board td { border: 2px solid #000; padding: 0; text-align: center; vertical-align: middle; cursor: pointer; }
td.lit { background: #000; }
td.off { background: #fff; }
td.lit span { display: block; margin: 0 auto; border: 3px solid #fff; border-radius: 50%; }
</style>
</head>
<body>
<div class="app-container">
  <main class="main-layout">
    <section class="board-column">
      <div class="status" id="status"></div>
      <div class="wrap"><table class="board" id="board"></table></div>
    </section>
    <section class="bottom-menu">
      <div class="action-bar-grid">
        <a class="btn" href="index.html">&#8592; Games</a>
        <button class="btn" id="btnUndo">Undo</button>
        <button class="btn" id="btnReset">Restart</button>
        <button class="btn" id="btnNew">New</button>
      </div>
      <div class="match-setup-row">
        <select class="btn" id="selSize">
          <option value="4">4 &times; 4</option>
          <option value="5" selected>5 &times; 5</option>
          <option value="6">6 &times; 6</option>
          <option value="7">7 &times; 7</option>
        </select>
      </div>
    </section>
  </main>
  <div class="help">
    <h2>How to play</h2>
    Tapping a square flips it and its four neighbours (up, down, left, right).
    Turn every light off (all squares white) in as few moves as possible.
  </div>
</div>
<script>
(function () {
  var N = 5, grid = [], start = [], moves = 0, history = [], done = false;
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var selSize = document.getElementById('selSize');

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function cellSize() {
    var w = window.innerWidth || document.documentElement.clientWidth || 600;
    var h = window.innerHeight || document.documentElement.clientHeight || 800;
    var s = Math.floor(Math.min(w - 30, h - 200) / N);
    return Math.max(44, Math.min(110, s));
  }

  function toggle(g, r, c) {
    var d = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]], i, rr, cc;
    for (i = 0; i < d.length; i++) {
      rr = r + d[i][0]; cc = c + d[i][1];
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) g[rr * N + cc] = !g[rr * N + cc];
    }
  }

  function litCount() { var n = 0, i; for (i = 0; i < grid.length; i++) if (grid[i]) n++; return n; }

  function newGame() {
    N = parseInt(selSize.value, 10);
    if (!(N >= 3 && N <= 9)) { N = 5; selSize.value = '5'; } // guard: NaN would loop forever below
    var i, k;
    // Build from random presses so the puzzle is always solvable.
    do {
      grid = [];
      for (i = 0; i < N * N; i++) grid.push(false);
      for (k = 0; k < N * N; k++) if (Math.random() < 0.5) toggle(grid, Math.floor(k / N), k % N);
    } while (litCount() === 0);
    start = grid.slice();
    moves = 0; history = []; done = false;
    store('lightsout.size', String(N));
    build(); render();
  }

  function restart() { grid = start.slice(); moves = 0; history = []; done = false; render(); }

  function build() {
    var s = cellSize(), html = '', r, c, d = Math.floor(s * 0.35);
    for (r = 0; r < N; r++) {
      html += '<tr>';
      for (c = 0; c < N; c++) html += '<td data-i="' + (r * N + c) + '" style="width:' + s + 'px;height:' + s + 'px"><span style="width:' + d + 'px;height:' + d + 'px"></span></td>';
      html += '</tr>';
    }
    boardEl.innerHTML = html;
  }

  function render() {
    var tds = boardEl.getElementsByTagName('td'), i;
    for (i = 0; i < tds.length; i++) tds[i].className = grid[i] ? 'lit' : 'off';
    var left = litCount();
    if (done) {
      statusEl.className = 'status win';
      statusEl.innerHTML = 'Solved in ' + moves + ' move' + (moves === 1 ? '' : 's') + '! Tap New to play again.';
    } else {
      statusEl.className = 'status';
      statusEl.innerHTML = 'Moves: ' + moves + ' &nbsp;&middot;&nbsp; Lights on: ' + left;
    }
    document.getElementById('btnUndo').disabled = history.length === 0 || done;
  }

  boardEl.onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    while (t && t.tagName !== 'TD') t = t.parentNode;
    if (!t || done) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    history.push(i);
    toggle(grid, Math.floor(i / N), i % N);
    moves++;
    if (litCount() === 0) done = true;
    render();
  };

  document.getElementById('btnUndo').onclick = function () {
    if (!history.length || done) return;
    var i = history.pop();
    toggle(grid, Math.floor(i / N), i % N);
    moves--;
    render();
  };
  document.getElementById('btnReset').onclick = restart;
  document.getElementById('btnNew').onclick = newGame;
  selSize.onchange = newGame;

  var saved = store('lightsout.size');
  if (saved) selSize.value = saved;
  newGame();
})();
</script>
<script>
/* Shared: fold the "How to play" box; tap its heading to open/close. */
(function () {
  var ds = document.getElementsByTagName('div'), i;
  for (i = 0; i < ds.length; i++) if (ds[i].className === 'help') setup(ds[i]);
  function setup(box) {
    var h = box.getElementsByTagName('h2')[0];
    if (!h) return;
    box.className = 'help closed';
    h.onclick = function () { box.className = box.className === 'help' ? 'help closed' : 'help'; };
  }
})();
</script>
</body>
</html>
